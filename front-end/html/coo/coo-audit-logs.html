<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizational Audit Trail - Rorizon COO</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .stack { display: grid; gap: 16px; }
    .user-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .user-toolbar .form-input { flex: 1 1 0%; max-width: none; }
    .metric-chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; background: #f8fafc; border: 1px solid #e2e8f0; color: #0f172a; font-size: 12px; font-weight: 600; }
    .data-table td, .data-table th { white-space: normal !important; word-break: break-word !important; overflow-wrap: break-word !important; line-height: 1.45 !important; }
  </style>
</head>
<body>
  <div id="app-layout" data-title="Organizational Audit Trail" data-subtitle="Operational activity logs and compliance history for your organization">

    <div class="card stack">
      <div class="chart-header">
        <div>
          <h2 class="card__title">Organization Audit Logs</h2>
          <p style="color:#64748b; font-size:13px; margin-top:4px;">Verifiable activity trail of Manager, Analyst, and Executive operations</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn-outline" type="button" id="exportLogsBtn">
            <img src="../assets/icons/download0.svg" alt="" class="btn__icon" />
            <span>Export Logs (.CSV)</span>
          </button>
        </div>
      </div>

      <!-- Single Search Toolbar with Metric Badge -->
      <div class="user-toolbar">
        <input class="form-input" id="auditKeywordFilter" type="text" placeholder="Search logs by actor, event action, IP address, or outcome..." style="color:#0f172a;" />
        <span class="metric-chip" id="cooAuditEntryCount">0 logs</span>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th style="white-space:nowrap; width:18%;">TIMESTAMP</th>
              <th style="white-space:nowrap; width:22%;">ACTOR</th>
              <th style="width:40%;">EVENT ACTION</th>
              <th style="white-space:nowrap; width:10%;">IP ADDRESS</th>
              <th style="white-space:nowrap; width:10%;">OUTCOME</th>
            </tr>
          </thead>
          <tbody id="cooAuditTableBody">
            <tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:20px;">Loading audit logs...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    let activeFilteredLogs = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await Utils.loadDB();
      ensureSeedLogs();
      renderLogs();

      document.getElementById('auditKeywordFilter').addEventListener('input', renderLogs);
      document.getElementById('exportLogsBtn')?.addEventListener('click', downloadCSV);

      window.addEventListener('rorizon-db-updated', () => { ensureSeedLogs(); renderLogs(); });
      window.addEventListener('storage', () => { ensureSeedLogs(); renderLogs(); });
      Utils.startPolling(15000);
    });

    function currentOrganization() {
      const state = Utils.ensureCollections(Utils.getDB());
      const currentUser = Utils.getCurrentUser() || {};
      return state.organizations.find(o => o.id === currentUser.organizationId) || Utils.getCurrentOrganization();
    }

    function ensureSeedLogs() {
      const state = Utils.ensureCollections(Utils.getDB());
      const org = currentOrganization();
      if (!Array.isArray(state.auditLogs)) state.auditLogs = [];

      const orgLogs = state.auditLogs.filter(l => l.organizationId === org?.id);
      if (orgLogs.length === 0 && org) {
        state.auditLogs.push(
          {
            id: `log-${Date.now()}-1`,
            organizationId: org.id,
            timestamp: Utils.nowLabel(),
            actor: 'Elena Rostova',
            action: 'Published 2026 Organization Emission Target & Threshold Policies',
            ip: '192.168.1.42',
            status: 'Success',
            statusType: 'green'
          },
          {
            id: `log-${Date.now()}-2`,
            organizationId: org.id,
            timestamp: Utils.nowLabel(),
            actor: 'Mark Davis',
            action: 'Submitted Q2 2026 Facility Data Report for Operations Dept',
            ip: '192.168.1.55',
            status: 'Success',
            statusType: 'green'
          },
          {
            id: `log-${Date.now()}-3`,
            organizationId: org.id,
            timestamp: Utils.nowLabel(),
            actor: 'Sarah Jenkins',
            action: 'Requested data correction for Logistics Dept submission',
            ip: '192.168.1.88',
            status: 'Warning',
            statusType: 'amber'
          }
        );
        Utils.replaceDB(state);
      }
    }

    function getScopedAuditLogs() {
      const db = Utils.ensureCollections(Utils.getDB());
      const currentUser = Utils.getCurrentUser() || {};
      const organization = currentOrganization();
      const organizationId = organization?.id || '';
      const users = Array.isArray(db.users) ? db.users : [];
      const logs = Array.isArray(db.auditLogs) ? db.auditLogs : [];

      const allowedUsers = users.filter(user => user.organizationId === organizationId && ['COO', 'Manager', 'Analyst'].includes(user.role));
      const allowedActors = new Set(allowedUsers.map(user => user.name));

      return logs.filter(log => {
        if (log.organizationId && log.organizationId === organizationId) return true;
        const actor = String(log.actor || '');
        if (!actor || actor.includes('Super User') || actor.includes('Anonymous')) return false;
        if (allowedActors.has(actor)) return true;
        return allowedUsers.some(user => actor.toLowerCase().includes(user.name.toLowerCase()));
      });
    }

    function filterLogs(logs) {
      const keywordValue = document.getElementById('auditKeywordFilter').value.trim().toLowerCase();
      return logs.filter(log => {
        if (!keywordValue) return true;
        const haystack = `${log.timestamp || ''} ${log.actor || ''} ${log.action || ''} ${log.ip || ''} ${log.status || ''}`.toLowerCase();
        return haystack.includes(keywordValue);
      });
    }

    function renderLogs() {
      const logs = getScopedAuditLogs();
      const filtered = filterLogs(logs);
      activeFilteredLogs = filtered;

      document.getElementById('cooAuditEntryCount').textContent = `${filtered.length} log${filtered.length === 1 ? '' : 's'}`;

      const tbody = document.getElementById('cooAuditTableBody');
      if (!tbody) return;

      if (filtered.length === 0) {
        tbody.innerHTML = Utils.renderEmptyTableRow(5, 'No Audit Logs Found', 'No organizational audit events match your search term.', 'inbox');
        return;
      }

      tbody.innerHTML = filtered.map(log => {
        const badgeClass = log.statusType || (log.status === 'Success' ? 'green' : (log.status === 'Warning' ? 'amber' : 'red'));

        return `
          <tr>
            <td class="td--bold" style="white-space:nowrap;">${log.timestamp || '--'}</td>
            <td class="td--bold" style="white-space:nowrap;">${log.actor || 'System'}</td>
            <td style="font-weight:500; color:#0f172a;">${log.action || '--'}</td>
            <td class="td--muted" style="font-family:monospace; font-size:13px; white-space:nowrap;">${log.ip || '127.0.0.1'}</td>
            <td style="white-space:nowrap;"><span class="status-badge status-badge--${badgeClass}">${log.status || 'Success'}</span></td>
          </tr>
        `;
      }).join('');
    }

    function downloadCSV() {
      const logs = activeFilteredLogs.length > 0 ? activeFilteredLogs : getScopedAuditLogs();
      if (logs.length === 0) return Utils.showToast("No audit log data to export.", "error");

      let csvContent = "Timestamp,Actor,Event Action,IP Address,Outcome\n";
      logs.forEach(log => {
        csvContent += `"${log.timestamp || ''}","${log.actor || ''}","${log.action || ''}","${log.ip || ''}","${log.status || ''}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", "Rorizon_Organization_Audit_Logs.csv");
      link.style.visibility = 'hidden';
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      Utils.showToast("CSV Downloaded Successfully.");
    }
  </script>
</body>
</html>
