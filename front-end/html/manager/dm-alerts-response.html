<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerts &amp; Response - Rorizon Manager</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .stack { display: grid; gap: 16px; }
    .toggle-group { justify-content: space-between; align-items: center; width: 100%; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .toggle-btn-group { display: flex; gap: 8px; }

    .user-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .user-toolbar .form-input { flex: 1 1 0%; max-width: none; }
    .metric-chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; background: #f8fafc; border: 1px solid #e2e8f0; color: #0f172a; font-size: 12px; font-weight: 600; }

    /* Ultra-clean Alert Cards */
    .alert-item-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; transition: all 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
    .alert-item-card:hover { border-color: #cbd5e1; }

    .alert-header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; cursor: pointer; }

    .alert-drawer-body { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f1f5f9; display: none; }
    .alert-drawer-body.is-expanded { display: block; }

    /* Sleek & Simple Governance Stepper Bar */
    .stepper-bar { display: flex; align-items: center; gap: 10px; background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 8px; padding: 8px 12px; margin-top: 12px; overflow-x: auto; }
    .step-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #94a3b8; white-space: nowrap; }
    .step-item.completed { color: #16a34a; }
    .step-item.current { color: #2563eb; font-weight: 700; }
    .step-dot { width: 18px; height: 18px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
    .step-item.completed .step-dot { background: #dcfce7; color: #15803d; }
    .step-item.current .step-dot { background: #dbeafe; color: #1d4ed8; }
    .step-arrow { color: #cbd5e1; font-size: 10px; }

    .alert-meta-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; background: #f8fafc; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .alert-meta-grid span { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 4px; }
    .alert-meta-grid strong { font-size: 14px; color: #0f172a; font-weight: 600; }

    .variance-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }

    .directive-banner { padding: 14px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
    .directive-banner--coo { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; }
    .directive-banner--analyst { background: #fffbebfb; border: 1px solid #fef3c7; color: #92400e; }

    /* Executive Sustainability Table */
    .resource-breakdown-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .resource-breakdown-table th { text-align: left; background: #f8fafc; padding: 10px 12px; font-size: 11px; font-weight: 700; color: #475569; border-bottom: 1px solid #e2e8f0; }
    .resource-breakdown-table td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; color: #0f172a; vertical-align: middle; }

    .action-btn { border: 1px solid #cbd5e1 !important; background: #fff !important; color: #0f172a !important; padding: 6px 12px !important; border-radius: 8px !important; font-size: 12px !important; font-weight: 700 !important; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s ease; text-decoration: none; }
    .action-btn:hover { background: #f8fafc !important; border-color: #64748b !important; }

    @media(max-width: 900px) { .alert-meta-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div id="app-layout" data-title="Alerts &amp; Response" data-subtitle="Department alert workspace">

    <!-- Admin Segmented Control Toggle Group -->
    <div class="toggle-group">
      <div class="toggle-btn-group">
        <button class="toggle-btn active" id="tabActiveAlerts" type="button">Active Escalations (0)</button>
        <button class="toggle-btn" id="tabResolvedAlerts" type="button">Resolved History (0)</button>
      </div>

      <span class="metric-chip" id="activeAlertCount">0 Active Alerts</span>
    </div>

    <div class="card stack">
      <!-- Admin Style Toolbar with Search Input & Department Selector -->
      <div class="user-toolbar">
        <input type="text" class="form-input" id="searchAlerts" placeholder="Search alert title, resource, message, or directive..." style="color:#0f172a;" />
        <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <label style="font-size:13px; font-weight:600; color:#475569;">Active Department:</label>
          <select class="form-input" id="deptAlertSelect" style="width:170px; color:#0f172a;"></select>
        </div>
      </div>

      <!-- Alert Cards Feed -->
      <div id="managerAlertCards" class="stack"></div>
    </div>

  </div>

  <div class="toast toast--success" id="toastMessage">
    <div class="toast__icon"><img src="../assets/icons/check-circle0.svg" alt=""></div>
    <p class="toast__text" id="toastText"></p>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    let activeTab = 'active';
    let expandedAlertIds = new Set();
    let initializedTab = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await Utils.loadDB();
      const currentUser = Utils.getCurrentUser() || {};
      const state = Utils.ensureCollections(Utils.getDB());
      const host = document.getElementById('managerAlertCards');
      const activeCountElem = document.getElementById('activeAlertCount');
      const searchInput = document.getElementById('searchAlerts');

      const assignedDeptIds = Utils.getUserDepartmentScope(currentUser, state).map(id => String(id));
      const managerDepartments = (state.departments || []).filter(d => {
        if (!currentUser) return false;
        const dIdStr = String(d.id);
        if (assignedDeptIds.includes(dIdStr)) return true;
        if (String(currentUser.departmentId) === dIdStr) return true;
        if (Array.isArray(currentUser.assignedDepartmentIds) && currentUser.assignedDepartmentIds.map(x => String(x)).includes(dIdStr)) return true;
        if (d.managerUserId && String(d.managerUserId) === String(currentUser.id)) return true;
        if (d.manager && currentUser.name && d.manager.trim().toLowerCase() === currentUser.name.trim().toLowerCase()) return true;
        return false;
      });

      const deptAlertSelect = document.getElementById('deptAlertSelect');
      if (deptAlertSelect) {
        if (managerDepartments.length > 0) {
          deptAlertSelect.innerHTML = `<option value="all">All Assigned Departments (${managerDepartments.length})</option>` +
            managerDepartments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
          deptAlertSelect.value = 'all';
        } else {
          deptAlertSelect.innerHTML = `<option value="all">All Assigned Departments</option>`;
        }

        deptAlertSelect.addEventListener('change', () => {
          initializedTab = null;
          renderAlerts();
          const selectedDept = getSelectedDept();
          Utils.showToast(selectedDept ? `Filtered alerts for ${selectedDept.name}` : 'Showing alerts for all assigned departments');
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', renderAlerts);
      }

      function getSelectedDept() {
        const selectedId = deptAlertSelect ? deptAlertSelect.value : 'all';
        if (!selectedId || selectedId === 'all') return null;
        return (state.departments || []).find(d => String(d.id) === String(selectedId)) || null;
      }

      function getScopedAlerts(db) {
        const activeDept = getSelectedDept();
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        const currentOrg = Utils.getCurrentOrganization(currentUser, db);
        const orgId = currentOrg?.id || currentUser.organizationId;
        const scopedDeptIds = managerDepartments.map(d => String(d.id));

        let alerts = (db.alerts || []).filter(alert => {
          const isManagerRole = !alert.roleScope || 
            (Array.isArray(alert.roleScope) && alert.roleScope.includes('Manager')) ||
            (typeof alert.roleScope === 'string' && alert.roleScope.includes('Manager'));
          
          const alertDeptId = alert.departmentId ? String(alert.departmentId) : null;
          const sameDept = activeDept 
            ? (alertDeptId === String(activeDept.id) || alert.departmentName === activeDept.name) 
            : (!alertDeptId || scopedDeptIds.includes(alertDeptId) || managerDepartments.some(d => d.name === alert.departmentName));
            
          const sameOrg = orgId ? (!alert.organizationId || String(alert.organizationId) === String(orgId)) : true;
          return isManagerRole && sameDept && sameOrg;
        });

        // Sync active Correction Required submissions into alerts
        const submissions = Array.isArray(db.submissions) ? db.submissions : [];
        submissions.forEach(sub => {
          const subDeptId = String(sub.departmentId);
          const inScope = activeDept ? subDeptId === String(activeDept.id) : (scopedDeptIds.includes(subDeptId) || !scopedDeptIds.length);
          
          if ((sub.status === 'Correction Required' || sub.status === 'Rejected') && inScope) {
            const alreadyAlert = alerts.some(a => a.submissionId === sub.id || (a.period === sub.period && String(a.departmentId) === subDeptId));
            if (!alreadyAlert) {
              alerts.unshift({
                id: `alt-sub-corr-${sub.id}`,
                submissionId: sub.id,
                departmentId: sub.departmentId,
                departmentName: sub.departmentName,
                period: sub.period,
                severity: 'Warning',
                type: 'Data Correction Required',
                title: 'Data Correction Requested by Analyst',
                message: sub.correctionNotes || sub.analystNotes || 'Analyst requested data correction for this submission.',
                status: 'Correction Required',
                updatedAt: sub.updatedAt || Utils.nowLabel()
              });
            }
          }

          // Auto-detect threshold breaches from submissions if missing in db.alerts
          if ((sub.validation?.state === 'threshold_breach' || (sub.totalConsumption > 0 && sub.validation?.deviationReason)) && inScope) {
            const alreadyAlert = alerts.some(a => a.submissionId === sub.id || (a.period === sub.period && String(a.departmentId) === subDeptId));
            if (!alreadyAlert) {
              alerts.unshift({
                id: `alt-sub-thresh-${sub.id}`,
                submissionId: sub.id,
                departmentId: sub.departmentId,
                departmentName: sub.departmentName,
                period: sub.period,
                severity: 'Critical',
                type: 'Threshold Exceeded',
                title: `Threshold Breach (${sub.departmentName})`,
                currentValue: sub.totalConsumption,
                message: `Total consumption (${Number(sub.totalConsumption || 0).toLocaleString()} units) exceeded baseline threshold. Deviation: ${sub.validation?.deviationReason || 'Unspecified'}`,
                deviationReason: sub.validation?.deviationReason || '',
                status: sub.status === 'Approved' ? 'Resolved' : 'Active',
                updatedAt: sub.updatedAt || sub.submittedAt || Utils.nowLabel()
              });
            }
          }
        });

        if (query) {
          alerts = alerts.filter(a => {
            const haystack = `${a.type || a.title || ''} ${a.message || a.description || ''} ${a.cooDirective || ''} ${a.analystClarificationNotes || ''}`.toLowerCase();
            return haystack.includes(query);
          });
        }

        return alerts;
      }

      function renderAlerts() {
        const isEditing = document.activeElement && ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName);
        if (isEditing) return;

        const db = Utils.ensureCollections(Utils.getDB());
        const allAlerts = getScopedAlerts(db);
        const activeAlerts = allAlerts.filter(a => a.status !== 'Resolved');
        const resolvedAlerts = allAlerts.filter(a => a.status === 'Resolved');

        document.getElementById('tabActiveAlerts').textContent = `Active Escalations (${activeAlerts.length})`;
        document.getElementById('tabResolvedAlerts').textContent = `Resolved History (${resolvedAlerts.length})`;
        activeCountElem.textContent = `${activeAlerts.length} Active Alert${activeAlerts.length === 1 ? '' : 's'}`;

        const displayed = activeTab === 'active' ? activeAlerts : resolvedAlerts;
        const query = searchInput ? searchInput.value.trim() : '';
        const selectedDept = getSelectedDept();

        if (displayed.length === 0) {
          host.innerHTML = Utils.renderEmptyState(
            query ? 'No Matching Alerts Found' : (activeTab === 'active' ? 'No Active Escalations' : 'No Resolved History'),
            query 
              ? `No operational alerts matched "${query}".`
              : (activeTab === 'active'
                  ? `Your department (${selectedDept?.name || 'Selected Department'}) has no open threshold alerts or pending escalation items.`
                  : `No resolved alert records available for ${selectedDept?.name || 'this department'}.`),
            query ? 'search' : (activeTab === 'active' ? 'check' : 'inbox')
          );
          return;
        }

        if (initializedTab !== activeTab) {
          initializedTab = activeTab;
          expandedAlertIds.clear();
          if (displayed.length > 0) {
            expandedAlertIds.add(String(displayed[0].id));
          }
        }

        host.innerHTML = displayed.map(alert => {
          const isCorrection = alert.status === 'Correction Required' || alert.type === 'Data Correction Required';
          const alertIdStr = String(alert.id);
          const isExpanded = expandedAlertIds.has(alertIdStr);
          const dept = (db.departments || []).find(d => String(d.id) === String(alert.departmentId) || d.name === alert.departmentName);
          const sub = (db.submissions || []).find(s => (String(s.departmentId) === String(alert.departmentId) || s.departmentName === alert.departmentName) && s.period === alert.period);
          const isSubmittedToAnalyst = alert.status === 'Analyst Review' || alert.status === 'Resolved';
          const isClarificationRequested = alert.status === 'Clarification Requested';
          const status = (alert.status || 'Active').trim();
          const isResolved = status === 'Resolved';

          // Clean Minimal Card for Data Correction Alerts
          if (isCorrection) {
            return `
              <div class="alert-item-card" id="card-${alert.id}" style="border-left:4px solid #f59e0b;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                  <div>
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                      <span class="status-badge status-badge--amber">Correction Required</span>
                      <h3 style="margin:0; font-size:15px; font-weight:700; color:#0f172a;">${alert.title || 'Data Correction Requested'}</h3>
                    </div>
                    <p style="margin:0 0 6px 0; font-size:13px; color:#475569;">${alert.message || 'Analyst requested data correction for your submission.'}</p>
                    <div style="font-size:12px; color:#64748b;">
                      Department: <strong>${alert.departmentName || '--'}</strong> &bull; Period: <strong>${Utils.formatPeriodLabel(alert.period || '')}</strong>
                    </div>
                  </div>
                  <div>
                    <a class="btn-primary" href="dm-data-submission.html?resubmitId=${alert.submissionId || ''}" style="text-decoration:none; padding:8px 14px; font-size:13px;">Correct Data &amp; Resubmit &rarr;</a>
                  </div>
                </div>
              </div>
            `;
          }

          // Full Governance Card for Operational Threshold Alerts
          const curVal = Utils.parseAmount(alert.currentValue || alert.current || dept?.current || 0);
          const threshVal = Utils.parseAmount(alert.thresholdValue || alert.threshold || dept?.threshold || 0);
          let variancePct = 0;
          if (threshVal > 0 && curVal > threshVal) {
            variancePct = Math.round(((curVal - threshVal) / threshVal) * 100);
          }

          const rawResources = sub?.resources || alert.resources || [];
          const resourcesList = rawResources.map(r => {
            const qty = Number(r.qty || r.quantity || 0);
            const co2e = Number(r.co2e || 0);
            const targetVal = Number(r.targetQty || r.thresholdQty || Math.round(qty * 0.75));
            let lineVarPct = 0;
            if (targetVal > 0 && qty > targetVal) {
              lineVarPct = Math.round(((qty - targetVal) / targetVal) * 100);
            }
            return {
              ...r,
              qty,
              co2e,
              lineVarPct,
              evidence: r.evidenceFileName || r.evidenceUrl || 'Verified Entry'
            };
          });

          const hasManagerInput = Boolean((alert.managerExplanation && alert.managerExplanation.trim()) || (alert.deviationReason && alert.deviationReason.trim()));
          const s1Done = true;
          const s2Done = (hasManagerInput && !isClarificationRequested) || status === 'Analyst Review' || status === 'Manager Notified' || isResolved;
          const s2Current = !s2Done;
          const s3Done = status === 'Manager Notified' || isResolved;
          const s3Current = s2Done && !s3Done;
          const s4Done = isResolved;
          const s4Current = s3Done && !s4Done;

          return `
            <div class="alert-item-card" id="card-${alert.id}">
              <div class="alert-header-row" onclick="toggleAlertExpand('${alert.id}')">
                <div>
                  <h3 style="margin:0 0 2px 0; font-size:15px; font-weight:700; color:#0f172a;">${alert.type || alert.title || 'Operational Threshold Alert'}</h3>
                  <p style="margin:0; font-size:13px; color:#64748b;">${alert.message || alert.description || 'Spike or abnormal resource consumption detected.'}</p>
                </div>
                <div>
                  ${variancePct > 0 ? `<span class="variance-badge">+${variancePct}% Over Limit</span>` : `<span class="variance-badge" style="background:#fef3c7; border-color:#fde68a; color:#b45309;">Threshold Breach</span>`}
                </div>
              </div>

              <div class="stepper-bar">
                <div class="step-item ${s1Done ? 'completed' : ''}">
                  <span class="step-dot">✓</span>
                  <span>1. Breach Flagged</span>
                </div>
                <span class="step-arrow">►</span>
                <div class="step-item ${s2Done ? 'completed' : (s2Current ? 'current' : '')}">
                  <span class="step-dot">${s2Done ? '✓' : '2'}</span>
                  <span>2. Manager Justification</span>
                </div>
                <span class="step-arrow">►</span>
                <div class="step-item ${s3Done ? 'completed' : (s3Current ? 'current' : '')}">
                  <span class="step-dot">${s3Done ? '✓' : '3'}</span>
                  <span>3. Analyst Audit</span>
                </div>
                <span class="step-arrow">►</span>
                <div class="step-item ${s4Done ? 'completed' : (s4Current ? 'current' : '')}">
                  <span class="step-dot">${s4Done ? '✓' : '4'}</span>
                  <span>4. Executive Sign-off</span>
                </div>
              </div>

              <div class="alert-drawer-body ${isExpanded ? 'is-expanded' : ''}">
                <div class="alert-meta-grid">
                  <div><span>Department</span><strong>${alert.departmentName || '--'}</strong></div>
                  <div><span>Reporting Period</span><strong>${Utils.formatPeriodLabel(alert.period || '')}</strong></div>
                  <div><span>Current Consumption</span><strong>${dept ? (dept.current || '--') : '--'}</strong></div>
                  <div><span>Threshold Limit</span><strong style="color:#b45309;">${dept ? (dept.threshold || '--') : '--'}</strong></div>
                </div>

                ${alert.cooDirective ? `
                  <div class="directive-banner directive-banner--coo">
                    <strong style="display:block; margin-bottom:2px; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:#1d4ed8;">COO Executive Directive Issued:</strong>
                    "${alert.cooDirective}"
                  </div>
                ` : ''}

                ${alert.analystClarificationNotes ? `
                  <div class="directive-banner directive-banner--analyst">
                    <strong style="display:block; margin-bottom:2px; font-size:12px; text-transform:uppercase; letter-spacing:0.04em; color:#b45309;">Analyst Re-Explanation Request:</strong>
                    "${alert.analystClarificationNotes}"
                  </div>
                ` : ''}

                ${resourcesList.length > 0 ? `
                  <div style="margin-bottom:14px; background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:14px 16px;">
                    <div style="font-size:11px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; display:flex; justify-content:space-between;">
                      <span>Ingested Resource Activity &amp; Emissions Breakdown</span>
                      <span>${resourcesList.length} line item(s)</span>
                    </div>
                    <table class="resource-breakdown-table">
                      <thead>
                        <tr>
                          <th>RESOURCE TYPE</th>
                          <th style="text-align:right;">SUBMITTED ACTIVITY</th>
                          <th style="text-align:right;">EMISSIONS IMPACT</th>
                          <th style="text-align:center;">VARIANCE STATUS</th>
                          <th>VERIFICATION EVIDENCE</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${resourcesList.map(r => `
                          <tr>
                            <td style="font-weight:700; color:#0f172a;">${r.resourceTypeName || r.type || 'Resource'}</td>
                            <td style="text-align:right; font-weight:700; font-variant-numeric:tabular-nums;">${r.qty.toLocaleString()} <span style="font-size:11px; font-weight:500; color:#64748b;">${r.unitName || r.unit || 'Units'}</span></td>
                            <td style="text-align:right; font-weight:700; color:#0f172a; font-variant-numeric:tabular-nums;">${r.co2e.toLocaleString()} <span style="font-size:11px; font-weight:500; color:#64748b;">kg CO₂e</span></td>
                            <td style="text-align:center;">
                              ${r.lineVarPct > 0 
                                ? `<span class="variance-badge" style="font-size:10px; padding:2px 6px;">+${r.lineVarPct}% Over Baseline</span>`
                                : `<span style="font-size:11px; font-weight:600; color:#16a34a; background:#f0fdf4; border:1px solid #bbf7d0; padding:2px 6px; border-radius:4px;">Within Baseline</span>`}
                            </td>
                            <td>
                              ${r.evidence !== 'Verified Entry'
                                ? `<a class="action-btn" href="#" onclick="event.preventDefault(); Utils.showToast('Opening evidence document: ${r.evidence}');" style="font-size:11px; padding:3px 8px;">📎 ${r.evidence}</a>`
                                : `<span style="color:#64748b; font-size:11px;">Verified Record</span>`}
                            </td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                ` : ''}

                <div style="padding:12px 14px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; color:#334155; margin-bottom:14px;">
                  <strong>Deviation Details:</strong> ${alert.deviationReason || 'No threshold deviation notes recorded.'}
                </div>

                <div class="stack" style="gap:12px; margin-top:4px;">
                  <div>
                    <label class="form-label">Operational Explanation (What caused this consumption spike?)</label>
                    <textarea class="form-textarea" id="expl-${alert.id}" rows="2" ${isSubmittedToAnalyst ? 'disabled' : ''} placeholder="Provide operational cause (e.g. generator test, HVAC overload, production surge)...">${alert.managerExplanation || alert.deviationReason || ''}</textarea>
                  </div>
                  <div>
                    <label class="form-label">Corrective Measures Taken / Planned</label>
                    <textarea class="form-textarea" id="act-${alert.id}" rows="2" ${isSubmittedToAnalyst ? 'disabled' : ''} placeholder="Describe corrective actions taken...">${alert.managerActionTaken || ''}</textarea>
                  </div>
                  <div>
                    ${!isSubmittedToAnalyst ? `
                      <button class="btn-primary" type="button" onclick="handleManagerAlert('${alert.id}', event)" style="justify-content:center;">
                        ${isClarificationRequested ? 'Resubmit Clarified Explanation &amp; Escalate' : 'Send Explanation &amp; Escalate to Analyst'}
                      </button>
                    ` : `
                      <span style="font-size:12px; color:#16a34a; font-weight:600; background:#f0fdf4; padding:8px 14px; border-radius:6px; display:inline-block; border:1px solid #bbf7d0;">
                        ✓ Explanation submitted and escalated to Analyst for review
                      </span>
                    `}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      window.toggleAlertExpand = function(alertId) {
        const idStr = String(alertId);
        if (expandedAlertIds.has(idStr)) {
          expandedAlertIds.delete(idStr);
        } else {
          expandedAlertIds.add(idStr);
        }
        renderAlerts();
      };

      document.getElementById('tabActiveAlerts').addEventListener('click', () => {
        activeTab = 'active';
        document.getElementById('tabActiveAlerts').classList.add('active');
        document.getElementById('tabResolvedAlerts').classList.remove('active');
        renderAlerts();
      });

      document.getElementById('tabResolvedAlerts').addEventListener('click', () => {
        activeTab = 'resolved';
        document.getElementById('tabResolvedAlerts').classList.add('active');
        document.getElementById('tabActiveAlerts').classList.remove('active');
        renderAlerts();
      });

      window.handleManagerAlert = async function(alertId, event) {
        if (event) event.stopPropagation();

        const explElem = document.getElementById(`expl-${alertId}`);
        const actElem = document.getElementById(`act-${alertId}`);

        const explanation = explElem ? explElem.value.trim() : '';
        const actionTaken = actElem ? actElem.value.trim() : '';

        if (!explanation) {
          Utils.showToast('Please enter an operational explanation.', 'error');
          return;
        }

        const db = Utils.ensureCollections(Utils.getDB());
        if (!Array.isArray(db.alerts)) db.alerts = [];

        let alertIndex = db.alerts.findIndex(a => String(a.id) === String(alertId));
        if (alertIndex < 0) {
          // If auto-detected from a submission, create the alert in db.alerts
          const subId = String(alertId).replace(/^alt-sub-(corr|thresh)-/, '');
          const sub = (db.submissions || []).find(s => String(s.id) === String(subId));
          const newAlert = {
            id: alertId,
            submissionId: sub?.id || subId,
            departmentId: sub?.departmentId || currentUser.departmentId || 'dept-01',
            departmentName: sub?.departmentName || 'Department',
            organizationId: sub?.organizationId || currentUser.organizationId || 'org-01',
            period: sub?.period || '',
            type: 'Threshold Exceeded',
            title: `Threshold Breach (${sub?.departmentName || 'Department'})`,
            severity: 'Critical',
            message: sub?.validation?.deviationReason || explanation,
            status: 'Active',
            roleScope: ['Manager', 'Analyst', 'COO'],
            updatedAt: Utils.nowLabel(),
            createdAt: Utils.nowLabel()
          };
          db.alerts.unshift(newAlert);
          alertIndex = 0;
        }

        const alert = db.alerts[alertIndex];
        alert.managerExplanation = explanation;
        alert.managerActionTaken = actionTaken;
        alert.status = 'Analyst Review';
        alert.updatedAt = Utils.nowLabel();
        alert.managerName = currentUser.name || 'Department Manager';

        if (!Array.isArray(db.notifications)) db.notifications = [];
        db.notifications.unshift({
          id: Date.now(),
          role: 'Analyst',
          organizationId: alert.organizationId,
          title: 'Alert Response Submitted',
          body: `${alert.departmentName} Manager submitted response for alert: "${explanation.slice(0, 60)}..."`,
          timestamp: Utils.nowLabel(),
          read: false
        });

        Utils.logAction(`Manager submitted operational explanation for ${alert.departmentName} alert`, 'Info', 'blue');
        Utils.replaceDB(db);
        await Utils.apiFetch('PATCH', `/api/alerts/${alert.id}`, alert);

        window.dispatchEvent(new Event('rorizon-notifications-updated'));
        Utils.showToast('Response submitted and escalated to Analyst!');
        renderAlerts();
      };

      renderAlerts();

      function safeSync() {
        const isInputFocused = document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName);
        if (!isInputFocused) {
          renderAlerts();
        }
      }

      window.addEventListener('rorizon-db-updated', safeSync);
      window.addEventListener('storage', safeSync);
      Utils.startPolling(15000);
    });
  </script>
</body>
</html>
